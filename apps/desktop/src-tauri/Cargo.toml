[package]
name = "fetchpath-desktop"
version = "0.1.0"
description = "Fetchpath Windows desktop application"
authors = ["Fetchpath contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "fetchpath-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fetchpath_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fetchpath-core = { path = "../../../crates/fetchpath-core" }
fetchpath-media = { path = "../../../adapters/media" }
fetchpath-session = { path = "../../../crates/fetchpath-session" }
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-dialog = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.23.0"
