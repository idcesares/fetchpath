[package]
name = "fetchpath-desktop"
version = "0.2.0"
description = "Fetchpath Windows desktop application"
authors = ["Fetchpath contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "fetchpath-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fetchpath_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fetchpath-core = { path = "../../../crates/fetchpath-core" }
fetchpath-media = { path = "../../../adapters/media" }
fetchpath-protocol = { path = "../../../crates/fetchpath-protocol" }
# The browser host needs the inbox only. The desktop never links the session
# crate, so it cannot build a queue of its own (FP-055).
fetchpath-browser-inbox = { path = "../../../crates/fetchpath-browser-inbox" }
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-dialog = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.23.0"
