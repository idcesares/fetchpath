[package]
name = "fetchpath-protocol"
version = "0.1.0"
description = "Fetchpath engine protocol v1: wire types, framing, JSON Schema and the EngineClient interface"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
getrandom = "0.3.4"
hmac = "0.13.0"
sha2 = "0.11.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.23.0"
