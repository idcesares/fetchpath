[package]
name = "fetchpath-session"
version = "0.1.0"
description = "Fetchpath download session: queue, persistence, scheduling, retry, history and settings"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fetchpath-browser-inbox = { path = "../fetchpath-browser-inbox" }
fetchpath-core = { path = "../fetchpath-core" }
fetchpath-lan = { path = "../../adapters/lan" }
fetchpath-media = { path = "../../adapters/media" }
fetchpath-protocol = { path = "../fetchpath-protocol" }
fetchpath-providers = { path = "../../adapters/providers" }
fetchpath-torrent = { path = "../../adapters/torrent" }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.3.4"
hkdf = "0.13.0"
# hkdf 0.13 is built on sha2 0.11; the rest of this crate still hashes with 0.10.
sha2_11 = { package = "sha2", version = "0.11.0" }
zeroize = "1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["v4"] }
url = "2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.23.0"
