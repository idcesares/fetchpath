[package]
name = "fetchpath-session"
version = "0.1.0"
description = "Fetchpath download session: queue, persistence, scheduling, retry, history and settings"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fetchpath-core = { path = "../fetchpath-core" }
fetchpath-media = { path = "../../adapters/media" }
fetchpath-protocol = { path = "../fetchpath-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["v4"] }
url = "2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.23.0"
