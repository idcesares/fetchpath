[package]
name = "fetchpath-browser-inbox"
version = "0.1.0"
description = "Fetchpath browser capture inbox: captures the browser host accepted and their DPAPI-protected request context"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = { workspace = true }
