name: Checks
on: [push, pull_request]
concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    env:
      FETCHPATH_REQUIRE_WEB: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tools/tasks.mjs check
      # The desktop crate embeds the built front end, so build it before cargo.
      - run: corepack pnpm --dir apps/desktop install --frozen-lockfile
      - run: corepack pnpm --dir apps/desktop audit --audit-level moderate
      - run: corepack pnpm --dir apps/desktop build
      # The command-line crate embeds the web UI; FETCHPATH_REQUIRE_WEB makes a missing bundle fail.
      - run: corepack pnpm --dir apps/desktop build:web
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.98.1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Also builds target/debug/fetchpath-browser-host.exe for the Node tests.
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Helper policy and durable publication recovery
        run: cargo test -p fetchpath-session --locked automatic_policy_restarts_running_helpers_and_applies_at_start -- --ignored
        env:
          CARGO_TARGET_DIR: work/target-policy
      - run: node tools/tests.mjs
      # The notices cover every platform's crates; the build fetched only Windows'.
      - run: cargo fetch --locked
      - run: node tools/licenses/generate.mjs --check
