[workspace]
members = ["crates/fetchpath-browser-inbox", "crates/fetchpath-cache", "crates/fetchpath-core", "crates/fetchpath-http", "crates/fetchpath-metalink", "crates/fetchpath-protocol", "crates/fetchpath-relay", "crates/fetchpath-session", "crates/fetchpath-storage", "adapters/lan", "adapters/media", "adapters/providers", "adapters/torrent", "apps/cli", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.3.4"
hkdf = "0.13.0"
hmac = "0.13.0"
qrcode = { version = "=0.14.1", default-features = false }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sha2_11 = { package = "sha2", version = "0.11.0" }
tempfile = "3.23.0"
tokio = { version = "1.48.0", default-features = false }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }
windows-sys = "0.61.2"
zeroize = "1.9.0"
