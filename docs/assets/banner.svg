<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t">
  <title id="t">Fetchpath: one download engine for every frontend, for people and AI agents. It resumes, verifies and never overwrites.</title>
  <!-- Colors from design/tokens.css (dark values); mark from apps/desktop/src-tauri/icons/source.svg. System fonts only. The dark panel reads the same on light and dark pages. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 7 5 2 8.5" fill="none" stroke="#7ce0b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#17211c"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#0b100e"/>
  <rect width="1280" height="360" rx="20" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#34433c"/>

  <!-- Brand -->
  <g transform="translate(72 64)">
    <rect width="96" height="96" rx="22" fill="#7ce0b7"/>
    <g transform="translate(18 18) scale(2.52)" fill="none" stroke="#06120d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 18c5 0 3-12 8-12h6"/><circle cx="5" cy="18" r="1.6"/><path d="m16 3 3 3-3 3"/>
    </g>
  </g>
  <text x="196" y="138" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif" font-size="76" font-weight="760" fill="#eef5f1" letter-spacing="-1.5">Fetchpath</text>
  <text x="74" y="224" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif" font-size="36" font-weight="640" fill="#eef5f1">One download engine.</text>
  <text x="74" y="268" font-family="'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif" font-size="30" fill="#a9b7b0">Every frontend. People and AI agents.</text>
  <text x="76" y="316" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="17" fill="#7ce0b7" letter-spacing="2">RESUMES · VERIFIES · NEVER OVERWRITES</text>

  <!-- Frontends converge on one engine -->
  <g fill="none" stroke="#3f574d" stroke-width="2.5" stroke-linecap="round">
    <path d="M846 86C904 86 904 180 962 180"/>
    <path d="M846 148C896 148 904 180 962 180"/>
    <path d="M846 210C896 210 904 180 962 180"/>
    <path d="M846 272C904 272 904 180 962 180" stroke="#7ce0b7"/>
  </g>
  <g font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="19" fill="#eef5f1">
    <g><rect x="690" y="64" width="156" height="44" rx="12" fill="#141b18" stroke="#34433c"/><text x="710" y="92">Desktop</text></g>
    <g><rect x="690" y="126" width="156" height="44" rx="12" fill="#141b18" stroke="#34433c"/><text x="710" y="154">Terminal</text></g>
    <g><rect x="690" y="188" width="156" height="44" rx="12" fill="#141b18" stroke="#34433c"/><text x="710" y="216">Browser</text></g>
    <g><rect x="690" y="250" width="156" height="44" rx="12" fill="#1d4a39" stroke="#7ce0b7"/><text x="710" y="278" fill="#b2f4d7">AI agents</text></g>
  </g>
  <text x="690" y="324" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="14" fill="#8a9992" letter-spacing="1.5">CLI + MCP + EXTENSION + DESKTOP, ONE QUEUE</text>

  <rect x="962" y="120" width="120" height="120" rx="28" fill="#7ce0b7"/>
  <g transform="translate(980 138) scale(3.5)" fill="none" stroke="#06120d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 18c5 0 3-12 8-12h6"/><circle cx="5" cy="18" r="1.6"/><path d="m16 3 3 3-3 3"/>
  </g>
  <text x="1022" y="266" text-anchor="middle" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="15" fill="#7ce0b7" letter-spacing="2">ONE ENGINE</text>

  <path d="M1088 180H1162" stroke="#7ce0b7" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/>
  <circle cx="1210" cy="180" r="30" fill="#17382c" stroke="#7ce0b7" stroke-width="2.5"/>
  <path d="m1197 180 9 9 18-19" fill="none" stroke="#b2f4d7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1210" y="238" text-anchor="middle" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="14" fill="#a9b7b0" letter-spacing="1">SHA-256</text>
  <text x="1210" y="256" text-anchor="middle" font-family="'Cascadia Mono',Consolas,ui-monospace,monospace" font-size="14" fill="#a9b7b0" letter-spacing="1">VERIFIED</text>
</svg>
