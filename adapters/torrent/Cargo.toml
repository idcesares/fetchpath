[package]
name = "fetchpath-torrent"
version = "0.1.0"
description = "Isolated BitTorrent helper and process client for Fetchpath"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
helper = ["dep:librqbit", "dep:tokio", "dep:reqwest", "dep:futures-util"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls", "disable-upload"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
futures-util = { version = "0.3", optional = true }

[[bin]]
name = "fetchpath-torrent-helper"
path = "src/main.rs"
required-features = ["helper"]

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
