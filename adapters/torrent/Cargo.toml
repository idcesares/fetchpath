[package]
name = "fetchpath-torrent"
version = "0.1.0"
description = "Isolated BitTorrent helper and process client for Fetchpath"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
helper = ["dep:librqbit", "dep:tokio", "dep:reqwest", "dep:futures-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls", "disable-upload"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
futures-util = { version = "0.3", optional = true }

[[bin]]
name = "fetchpath-torrent-helper"
path = "src/main.rs"
required-features = ["helper"]

[dev-dependencies]
tempfile = "3"
