[package]
name = "fetchpath-lan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fetchpath-cache = { path = "../../crates/fetchpath-cache" }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
curve25519-dalek = "5.0.0"
ed25519-dalek = "3.0.0"
getrandom = "0.3.4"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
zeroize = "1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
